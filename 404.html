<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#16381d" />
  <title>Pagina non trovata | La Casetta Marsicana</title>
  <link rel="icon" type="image/png" href="./images/logo-icona.png" />
  <style>
    :root {
      --green-dark: #16381d;
      --green-main: #285232;
      --ivory: #f7f3ea;
      --brown-main: #5c4523;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--ivory);
      color: var(--green-dark);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(680px, 100%);
      text-align: center;
      background: #fff;
      border: 1px solid rgba(22, 56, 29, 0.1);
      border-radius: 22px;
      padding: 3rem 2rem;
      box-shadow: 0 16px 40px rgba(22, 56, 29, 0.08);
    }
    img { width: 110px; height: auto; margin-bottom: 1rem; }
    h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 7vw, 3.6rem); }
    p { margin: 0 auto 1.6rem; max-width: 520px; line-height: 1.6; color: #4f574f; font-family: Arial, sans-serif; }
    a {
      display: inline-block;
      padding: 0.85rem 1.2rem;
      border-radius: 999px;
      background: var(--green-dark);
      color: #fff;
      text-decoration: none;
      font: 700 1rem Arial, sans-serif;
    }
    a:hover { background: var(--green-main); }
  </style>
</head>
<body>
  <main>
    <img src="./images/logo-icona.png" alt="La Casetta Marsicana" />
    <h1>Pagina non trovata</h1>
    <p>La pagina che stai cercando non esiste o è stata spostata. Puoi tornare alla pagina principale della Casetta.</p>
    <a href="https://www.lacasettamarsicana.it/">Torna alla home</a>
  </main>
</body>
</html>
